# Weekly RAG index: Liquipedia, patch notes, Reddit, Kalshi → Supabase documents
#
# Schedule: Monday 04:00 UTC. Manual: workflow_dispatch.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENROUTER_API_KEY
# Optional: KALSHI_API_KEY (Kalshi API key ID for market data requests)

name: Index RAG Documents

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: index-rag-documents
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RAG indexer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: npm run index:rag
