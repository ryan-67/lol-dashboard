# Export oe_slices from Supabase into public/data CDN shards and commit.
# Use when shards are missing from the repo or Supabase was seeded without ingest.

name: Publish OE CDN Shards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Export shards from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_oe_shards.py

      - name: Commit and push CDN shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/preserve-generated-worktree.sh
          git add public/data/oe_slices.json public/data/oe_slices_*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): publish OE CDN shards from Supabase"
            bash scripts/ci/push-main-with-rebase.sh
          else
            echo "Shards unchanged — nothing to commit."
          fi
