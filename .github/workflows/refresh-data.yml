# Refresh Dashboard Data (v4 — Riot warehouse primary; OE historical backbone; Cito soft fallback)
#
# Autonomous flow (every 2h + manual dispatch):
# 1) check: OE Drive CSV fingerprint (historical backfill trigger only)
# 2) sync-current (ALWAYS — Riot GW + Live Stats is the Current SoR):
#      - Riot ingest: schedules → cito_schedules + riot_schedule_cache.json;
#        Live Stats box scores → data/riot/games/ warehouse;
#        Cito gap-fill for uncovered/partial series → same warehouse (source=cito_gapfill);
#        OE-shaped supplement → data/ml/riot_oe_supplement.csv;
#        player box scores → cito_player_stats_cache.json + cito_player_game_stats
#      - QA completeness gate (hard fail if tier-1 coverage broken)
#      - Cito schedule sync (SOFT fallback during migration)
#      - external schedules + live drafts (soft)
#      - recaps for completed series (warehouse box scores)
#      - Elo bump when new games landed
#      - commit warehouse + caches
# 3) refresh-current-ml when new Riot games landed:
#      - restore cached OE CSV history + regenerate Riot supplement
#      - full ML retrain / ratings / insights publish (does NOT wait on OE Drive)
# 4) refresh-oe-ml ONLY when OE Drive advanced OR force_oe_ml:
#      - OE CSV download → ingest (+ Riot supplement rows) → seed oe_slices
#      - full ML retrain (historical backfill when Drive moves)
#
# Riot GW + Live Stats is primary for current form. OE remains multi-year history.
# Cito is a demoted soft fallback (docs/nucky_v4.md §15).
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional: CITO_API_KEY (fallback), GOOGLE_SERVICE_ACCOUNT_KEY, OE_DRIVE_FOLDER_ID,
#           OPENROUTER_API_KEY, SUPABASE_ACCESS_TOKEN
#
# Apply migrations:
#   supabase/migrations/oe_sync_state.sql
#   supabase/migrations/20260801120000_cito_sync_and_drafts.sql
#   supabase/migrations/20260801140000_cito_player_game_stats.sql
#   supabase/migrations/20260805090000_riot_sync_state.sql

name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      download_scope:
        description: CSV years to download from Drive (OE deep stats / ML)
        required: true
        default: current
        type: choice
        options:
          - current
          - all
      regenerate_recaps:
        description: Regenerate all weekly recap summaries (overwrite cached rows)
        required: true
        default: false
        type: boolean
      force_oe_ml:
        description: Force OE download + full ML retrain even if Drive unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

# Only the latest refresh matters. cancel-in-progress:true so a stuck/queued run
# (e.g. GitHub hosted-runner outage) does not block the next schedule/dispatch
# behind an indefinite concurrency queue. Overlapping crons are rare — sync is
# usually <60m; ML retrain only when riot_new/OE moves.
#
# Cloud Agents / humans may push to main while this job trains. Artifact commits
# rebase + retry via scripts/ci/push-main-with-rebase.sh — do not pause agents.
concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      oe_changed: ${{ steps.result.outputs.oe_changed }}
      run_oe_ml: ${{ steps.result.outputs.run_oe_ml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Determine OE historical refresh need
        id: result
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_oe_ml }}" = "true" ]; then
            echo "oe_changed=true" >> "$GITHUB_OUTPUT"
            echo "run_oe_ml=true" >> "$GITHUB_OUTPUT"
            echo "Manual run with force_oe_ml — OE ingest + full retrain."
            exit 0
          fi
          oe=$(python scripts/check_oe_drive.py --format github || echo true)
          echo "oe_changed=$oe" >> "$GITHUB_OUTPUT"
          echo "run_oe_ml=$oe" >> "$GITHUB_OUTPUT"
          echo "OE Drive CSV changed: $oe (Riot current ingest always runs)"

  # Primary path — Riot GW + Live Stats keeps Hub/Board/recaps fresh every run.
  sync-current:
    needs: check
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      riot_new: ${{ steps.riot_ingest.outputs.riot_new }}
      riot_new_games: ${{ steps.riot_ingest.outputs.riot_new_games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Riot warehouse ingest (schedules + Live Stats + Cito gap-fill) [HARD]
        id: riot_ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/riot/ingest_riot.py --days 14

      - name: Riot warehouse QA completeness gate [HARD]
        run: python scripts/riot/qa_completeness.py --days 7

      - name: Sync Cito league schedules (SOFT fallback during migration)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-schedule

      - name: Sync external schedules (Leaguepedia EWC, etc.)
        continue-on-error: true
        run: npm run sync:external-schedule

      - name: Sync live post-draft comps (Cito drafts endpoint)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-live-drafts -- --hours 8 --max 30

      - name: Sync Cito player box scores (SOFT fallback supplement)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-player-stats -- --max-matches 30 --days 21

      - name: Generate weekly recap summaries (warehouse box scores)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          RECAP_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_recaps && '1' || '0' }}
        run: npm run generate:weekly-recap

      - name: Bump Elo / power rankings from new completed series
        if: steps.riot_ingest.outputs.riot_new == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run bump:elo-cito

      - name: Commit Riot warehouse + current caches
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/preserve-generated-worktree.sh
          git add \
            data/riot \
            data/ml/riot_oe_supplement.csv \
            public/data/riot_schedule_cache.json \
            public/data/cito_schedule_cache.json \
            public/data/cito_live_drafts.json \
            public/data/cito_player_stats_cache.json \
            public/data/region_strength.json \
            supabase/functions/agent-chat/ml/region_strength.json \
            || true
          git add -f \
            data/ml/artifacts/region_strength.json \
            data/ml/artifacts/cito_elo_bump_state.json \
            || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): sync Riot warehouse current (schedule, box scores, recaps)"
            bash scripts/ci/push-main-with-rebase.sh
          else
            echo "Current caches unchanged — skip commit."
          fi

  # Current model refresh — OE history cache + fresh Riot warehouse rows (no Drive wait).
  # Skipped when refresh-oe-ml also runs (that job retrains after OE ingest).
  refresh-current-ml:
    needs: [check, sync-current]
    if: >-
      needs.check.result == 'success' &&
      needs.sync-current.result == 'success' &&
      (needs.sync-current.outputs.riot_new == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.check.outputs.run_oe_ml != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Restore cached OE CSV history (training backbone)
        uses: actions/cache@v4
        with:
          path: lol
          key: oe-csv-history-v1-${{ github.run_id }}
          restore-keys: |
            oe-csv-history-v1-

      - name: Ensure OE history present for ML (cache miss → Drive download)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python scripts/ensure_oe_history.py --min-years 4

      - name: Regenerate Riot warehouse supplement (delta fetch on committed cache)
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/riot/ingest_riot.py --days 14 --no-supabase

      - name: Rebuild current-year dashboard shards (OE cache + Riot supplement)
        env:
          OE_DOWNLOAD_YEARS: current
        run: python scripts/ingest_csv.py

      - name: Publish current-year shards to repo
        env:
          OE_CDN_PUBLISH_YEARS: current
        run: python scripts/publish_oe_cdn_to_git.py

      - name: Seed Supabase oe_slices (current year)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OE_DOWNLOAD_YEARS: current
        run: python scripts/seed_supabase.py

      - name: Sync Cito player-stats → OE supplement CSV (SOFT fallback)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-player-stats -- --max-matches 40 --days 28

      - name: Install ML pipeline dependencies
        id: ml_deps
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: pip install -r scripts/requirements-ml.txt

      - name: Retrain model from OE history + Riot warehouse current rows
        if: steps.ml_deps.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        id: ml_retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python scripts/ml/build_feature_mart.py
          python scripts/ml/train_series_model.py
          python scripts/ml/train_draft_model.py
          python scripts/ml/build_trend_insights.py
          python scripts/ml/build_team_profiles.py
          python scripts/ml/build_champion_matchups.py
          python scripts/ml/build_player_ratings.py
          python scripts/ml/validate_champion_archetypes.py
          python scripts/ml/build_accuracy_scorecard.py
          python scripts/ml/export_artifacts.py

      - name: Publish model artifacts to nucky.gg
        id: ml_publish
        if: steps.ml_retrain.outcome == 'success'
        run: python scripts/ml/publish_model_to_site.py --outcome success

      - name: Lag-fill Elo for series after walk-forward as-of
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run bump:elo-cito

      - name: Record ML freshness after soft-fail (cron only)
        if: always() && steps.ml_deps.outcome == 'success' && steps.ml_retrain.outcome != 'success'
        continue-on-error: true
        env:
          RETRAIN_OUTCOME: ${{ steps.ml_retrain.outcome }}
        run: |
          outcome="${RETRAIN_OUTCOME:-failure}"
          python scripts/ml/write_ml_freshness.py --outcome "$outcome"
          echo "::warning::ML retrain did not succeed (outcome=$outcome). See public/data/ml_freshness.json"

      - name: Commit published model artifacts
        if: always() && (steps.ml_publish.outcome == 'success' || steps.ml_retrain.outcome != 'success') && steps.ml_deps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/preserve-generated-worktree.sh
          git add supabase/functions/agent-chat/ml/ || true
          git add \
            data/riot \
            data/ml/riot_oe_supplement.csv \
            public/data/player_ratings.json \
            public/data/region_strength.json \
            public/data/accuracy_scorecard.json \
            public/data/prediction_holdout_log.json \
            public/data/model_metadata.json \
            public/data/ml_freshness.json \
            public/data/cito_player_stats_cache.json \
            public/data/riot_schedule_cache.json || true
          git add -f \
            data/ml/artifacts/region_strength.json \
            data/ml/artifacts/cito_elo_bump_state.json || true
          if ! git diff --staged --quiet; then
            if [ "${{ steps.ml_retrain.outcome }}" = "success" ]; then
              git commit -m "chore(ml): refresh model from Riot warehouse current rows"
            else
              git commit -m "chore(ml): record freshness after soft-fail retrain"
            fi
            bash scripts/ci/push-main-with-rebase.sh
          else
            echo "Model artifacts unchanged — skip commit."
          fi

      - name: Deploy agent-chat edge function (live model packets)
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping live agent-chat deploy."
            exit 0
          fi
          REF=$(python -c "import os,re; u=os.environ.get('SUPABASE_URL',''); m=re.match(r'https://([a-z0-9-]+)\\.supabase\\.co', u or ''); print(m.group(1) if m else '')")
          if [ -z "$REF" ]; then
            echo "::warning::Could not parse project ref from SUPABASE_URL — skip edge deploy."
            exit 0
          fi
          npx supabase functions deploy agent-chat --project-ref "$REF" --use-api
          echo "Deployed agent-chat with Riot-refreshed ml/ artifacts to project $REF."

  # Historical backbone — OE deep stats + full ML retrain when Drive CSV advances.
  refresh-oe-ml:
    needs: [check, sync-current]
    if: needs.check.result == 'success' && needs.check.outputs.run_oe_ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Restore cached OE CSV history (for ML retrain)
        uses: actions/cache@v4
        with:
          path: lol
          key: oe-csv-history-v1-${{ github.run_id }}
          restore-keys: |
            oe-csv-history-v1-

      - name: Download Oracle's Elixir CSVs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/download_oe_csv.py

      - name: Backfill full OE history for ML training (cache miss only)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python scripts/ensure_oe_history.py --min-years 4

      - name: Refresh Riot warehouse supplement (shards + mart current rows)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/riot/ingest_riot.py --days 14 --no-supabase

      - name: Ingest CSVs into slice JSON shards (OE + Riot supplement)
        env:
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/ingest_csv.py

      - name: Publish OE CDN shards to repo
        env:
          OE_CDN_PUBLISH_YEARS: current
        run: python scripts/publish_oe_cdn_to_git.py

      - name: Seed Supabase oe_slices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/seed_supabase.py

      - name: Verify Supabase seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_supabase_seed.py

      - name: Backfill gol.gg gold timelines (fallback)
        continue-on-error: true
        id: gol_gold
        run: python scripts/backfill_gol_gold_timelines.py --year 2026 --max-fetch 50 --missing-only

      - name: Commit gol.gg gold cache
        if: steps.gol_gold.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/preserve-generated-worktree.sh
          git add public/data/gol_game_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): backfill gol.gg gold timelines"
            bash scripts/ci/push-main-with-rebase.sh
          else
            echo "gol gold cache unchanged — skip commit."
          fi

      - name: Setup Node (fallback syncs)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Cito player-stats → OE supplement (SOFT fallback)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-player-stats -- --max-matches 40 --days 28

      - name: Install ML pipeline dependencies
        id: ml_deps
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: pip install -r scripts/requirements-ml.txt

      - name: Retrain nuckyAI ML pipeline
        if: steps.ml_deps.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        id: ml_retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python scripts/ml/build_feature_mart.py
          python scripts/ml/train_series_model.py
          python scripts/ml/train_draft_model.py
          python scripts/ml/build_trend_insights.py
          python scripts/ml/build_team_profiles.py
          python scripts/ml/build_champion_matchups.py
          python scripts/ml/build_player_ratings.py
          python scripts/ml/validate_champion_archetypes.py
          python scripts/ml/build_accuracy_scorecard.py
          python scripts/ml/export_artifacts.py

      - name: Publish model artifacts to nucky.gg
        id: ml_publish
        if: steps.ml_retrain.outcome == 'success'
        run: python scripts/ml/publish_model_to_site.py --outcome success

      - name: Lag-fill Elo for series after walk-forward as-of
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run bump:elo-cito

      - name: Record ML freshness after soft-fail (cron only)
        if: always() && steps.ml_deps.outcome == 'success' && steps.ml_retrain.outcome != 'success'
        continue-on-error: true
        env:
          RETRAIN_OUTCOME: ${{ steps.ml_retrain.outcome }}
        run: |
          outcome="${RETRAIN_OUTCOME:-failure}"
          python scripts/ml/write_ml_freshness.py --outcome "$outcome"
          echo "::warning::ML retrain did not succeed (outcome=$outcome). See public/data/ml_freshness.json"

      - name: Commit published model artifacts (static site + edge bundle)
        if: always() && (steps.ml_publish.outcome == 'success' || steps.ml_retrain.outcome != 'success') && steps.ml_deps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/preserve-generated-worktree.sh
          git add supabase/functions/agent-chat/ml/ || true
          git add \
            data/riot \
            data/ml/riot_oe_supplement.csv \
            public/data/player_ratings.json \
            public/data/region_strength.json \
            public/data/accuracy_scorecard.json \
            public/data/prediction_holdout_log.json \
            public/data/model_metadata.json \
            public/data/ml_freshness.json \
            public/data/cito_player_stats_cache.json \
            public/data/riot_schedule_cache.json || true
          git add -f \
            data/ml/artifacts/region_strength.json \
            data/ml/artifacts/cito_elo_bump_state.json || true
          if ! git diff --staged --quiet; then
            if [ "${{ steps.ml_retrain.outcome }}" = "success" ]; then
              git commit -m "chore(ml): publish model artifacts to nucky.gg"
            else
              git commit -m "chore(ml): record freshness after soft-fail retrain"
            fi
            bash scripts/ci/push-main-with-rebase.sh
          else
            echo "Model publish artifacts unchanged — skip commit."
          fi

      - name: Deploy agent-chat edge function (live model packets)
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping live agent-chat deploy."
            exit 0
          fi
          REF=$(python -c "import os,re; u=os.environ.get('SUPABASE_URL',''); m=re.match(r'https://([a-z0-9-]+)\\.supabase\\.co', u or ''); print(m.group(1) if m else '')")
          if [ -z "$REF" ]; then
            echo "::warning::Could not parse project ref from SUPABASE_URL — skip edge deploy."
            exit 0
          fi
          npx supabase functions deploy agent-chat --project-ref "$REF" --use-api
          echo "Deployed agent-chat with fresh ml/ artifacts to project $REF."

      - name: Save OE Drive sync state
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/save_oe_drive_state.py
