# Refresh Oracle's Elixir data: Drive → ingest → Supabase.
#
# Twice daily (09:00 + 21:00 UTC), timed for tier-1 league match windows plus ~2–3h
# Oracle's Elixir CSV lag. OE publishes to Google Drive; we pull current-year CSV only.
#
#   09:00 UTC — Americas / overnight catch-up
#     LCS (PT): weekend blocks typically end ~04:00–07:00 UTC → OE ready by ~09:00.
#     Also ingests late LEC from the prior EU evening and any straggler rows.
#
#   21:00 UTC — Asia + Europe evening
#     LCK (KST): weekday/weekend evenings usually finish by ~12:00 UTC.
#     LPL (CST): evening blocks usually finish by ~15:00–16:00 UTC.
#     LEC (CET/CEST): Fri–Sun evenings usually finish by ~19:00–20:00 UTC.
#     + ~2–3h OE lag → safe pull around 21:00 UTC.
#
# Manual "all" run: download every year (initial backfill or full rebuild).
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GOOGLE_SERVICE_ACCOUNT_KEY
# Optional: OE_DRIVE_FOLDER_ID (OE Public Match Data folder shared with service account)

name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      download_scope:
        description: CSV years to download from Drive
        required: true
        default: current
        type: choice
        options:
          - current
          - all
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC — LCS + overnight catch-up
    - cron: '0 21 * * *'  # 21:00 UTC — LCK / LPL / LEC evening blocks

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Download Oracle's Elixir CSVs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/download_oe_csv.py

      - name: Ingest CSVs into slice JSON shards
        run: python scripts/ingest_csv.py

      - name: Seed Supabase oe_slices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/seed_supabase.py

      - name: Verify Supabase seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_supabase_seed.py
