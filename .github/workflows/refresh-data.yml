# Refresh Oracle's Elixir data: Drive → ingest → Supabase.
#
# Scheduled: every 2 hours, check OE Drive metadata first. Full download/ingest/seed
# runs only when the current-year CSV changed (modifiedTime, size, or md5Checksum).
#
# Manual workflow_dispatch always runs the full refresh.
#
# Requires oe_sync_state table — see supabase/migrations/oe_sync_state.sql
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GOOGLE_SERVICE_ACCOUNT_KEY
# Optional: OE_DRIVE_FOLDER_ID

name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      download_scope:
        description: CSV years to download from Drive
        required: true
        default: current
        type: choice
        options:
          - current
          - all
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Determine if refresh needed
        id: result
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — forcing full refresh."
          else
            changed=$(python scripts/check_oe_drive.py --format github)
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            if [ "$changed" = "true" ]; then
              echo "OE CSV changed on Drive — refresh will run."
            else
              echo "No OE CSV changes — skipping refresh."
            fi
          fi

  refresh:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Download Oracle's Elixir CSVs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/download_oe_csv.py

      - name: Ingest CSVs into slice JSON shards
        run: python scripts/ingest_csv.py

      - name: Seed Supabase oe_slices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/seed_supabase.py

      - name: Verify Supabase seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_supabase_seed.py

      - name: Save OE Drive sync state
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_oe_drive_state.py
