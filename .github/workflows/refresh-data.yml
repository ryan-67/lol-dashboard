name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Oracle Elixir CSVs
        run: python scripts/ingest_csv.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/oe_slices*.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh oe_slices data store $(date -u +%Y-%m-%d)"
            git push
          fi
