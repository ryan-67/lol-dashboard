# Refresh Dashboard Data (v3 — Cito-primary current; OE historical backbone)
#
# Autonomous flow (every 2h + manual dispatch):
# 1) check: Cito completed-series fingerprint (current) + OE Drive CSV (backfill)
# 2) sync-current (ALWAYS):
#      - sync Cito schedules + scores → cito_schedules
#      - sync external schedules (Leaguepedia EWC)
#      - poll live drafts → cito_match_drafts + public/data/cito_live_drafts.json
#      - generate recaps for Cito-complete series (no OE wait; score-only AI when box scores lag)
#      - bump Elo / power rankings from new Cito series when cito_changed
#      - sync Cito postgame gold (soft)
#      - commit schedule/draft/Elo caches; save cito_sync_state watermark
# 3) refresh-oe-ml ONLY when OE Drive advanced OR force_oe_ml:
#      - OE CSV → ingest → seed oe_slices (historical backbone for chat / deep stats)
#      - full ML retrain → publish (backfills player ratings + feature mart)
#
# Do NOT gate recaps, Hub freshness, or Elo bumps on OE. OE backfills when Drive moves.
# Post-draft: sync-live-drafts → Board / Predictions series vs game odds.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CITO_API_KEY
# Optional: GOOGLE_SERVICE_ACCOUNT_KEY, OE_DRIVE_FOLDER_ID, OPENROUTER_API_KEY,
#           SUPABASE_ACCESS_TOKEN
#
# Apply migrations:
#   supabase/migrations/oe_sync_state.sql
#   supabase/migrations/20260801120000_cito_sync_and_drafts.sql

name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      download_scope:
        description: CSV years to download from Drive (OE deep stats / ML)
        required: true
        default: current
        type: choice
        options:
          - current
          - all
      regenerate_recaps:
        description: Regenerate all weekly recap summaries (overwrite cached rows)
        required: true
        default: false
        type: boolean
      force_oe_ml:
        description: Force OE download + full ML retrain even if Drive unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cito_changed: ${{ steps.result.outputs.cito_changed }}
      oe_changed: ${{ steps.result.outputs.oe_changed }}
      run_oe_ml: ${{ steps.result.outputs.run_oe_ml }}
      run_cito_elo: ${{ steps.result.outputs.run_cito_elo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Determine Cito / OE refresh needs
        id: result
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cito_changed=true" >> "$GITHUB_OUTPUT"
            echo "run_cito_elo=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force_oe_ml }}" = "true" ]; then
              echo "oe_changed=true" >> "$GITHUB_OUTPUT"
              echo "run_oe_ml=true" >> "$GITHUB_OUTPUT"
            else
              oe=$(python scripts/check_oe_drive.py --format github || echo true)
              echo "oe_changed=$oe" >> "$GITHUB_OUTPUT"
              echo "run_oe_ml=$oe" >> "$GITHUB_OUTPUT"
            fi
            echo "Manual run — sync-current + Cito Elo; OE/ML only if Drive moved or force_oe_ml."
            exit 0
          fi

          cito=$(npx tsx scripts/cito/check-cito-updates.ts --format github || echo true)
          echo "cito_changed=$cito" >> "$GITHUB_OUTPUT"
          echo "run_cito_elo=$cito" >> "$GITHUB_OUTPUT"
          echo "Cito completed-series advanced: $cito"

          oe=$(python scripts/check_oe_drive.py --format github || echo true)
          echo "oe_changed=$oe" >> "$GITHUB_OUTPUT"
          echo "OE Drive CSV changed: $oe"

          # OE/ML is historical backfill only — never triggered by Cito alone.
          if [ "$oe" = "true" ]; then
            echo "run_oe_ml=true" >> "$GITHUB_OUTPUT"
            echo "Will run OE ingest + full ML retrain (Drive advanced)."
          else
            echo "run_oe_ml=false" >> "$GITHUB_OUTPUT"
            echo "OE unchanged — skip full retrain; Cito Elo bump handles current rankings."
          fi

  # Primary path — always keeps Hub/Board/recaps fresh from Cito.
  sync-current:
    needs: check
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Cito league schedules (series scores + bracket blocks)
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-schedule

      - name: Sync external schedules (Leaguepedia EWC, etc.)
        continue-on-error: true
        run: npm run sync:external-schedule

      - name: Sync live post-draft comps (Cito drafts endpoint)
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-live-drafts -- --hours 8 --max 30

      - name: Generate weekly recap summaries (Cito-complete; no OE wait)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          RECAP_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_recaps && '1' || '0' }}
        run: npm run generate:weekly-recap

      - name: Bump Elo / power rankings from new Cito series
        if: needs.check.outputs.run_cito_elo == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run bump:elo-cito

      - name: Sync Cito postgame gold timelines
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-postgame -- --max-matches 20

      - name: Commit Cito schedule + drafts + Elo bump
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/cito_schedule_cache.json \
            public/data/cito_live_drafts.json \
            public/data/region_strength.json \
            data/ml/artifacts/region_strength.json \
            data/ml/artifacts/cito_elo_bump_state.json \
            supabase/functions/agent-chat/ml/region_strength.json \
            || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): sync Cito current (schedule, drafts, Elo)"
            git push || (git fetch origin main && git rebase origin/main && git push)
          else
            echo "Cito current caches unchanged — skip commit."
          fi

      - name: Save Cito sync watermark
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run save:cito-sync-state

  # Historical backbone — OE deep stats + full ML retrain when Drive CSV advances.
  refresh-oe-ml:
    needs: [check, sync-current]
    if: needs.check.result == 'success' && needs.check.outputs.run_oe_ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Restore cached OE CSV history (for ML retrain)
        uses: actions/cache@v4
        with:
          path: lol
          key: oe-csv-history-v1-${{ github.run_id }}
          restore-keys: |
            oe-csv-history-v1-

      - name: Download Oracle's Elixir CSVs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/download_oe_csv.py

      - name: Backfill full OE history for ML training (cache miss only)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python scripts/ensure_oe_history.py --min-years 4

      - name: Ingest CSVs into slice JSON shards
        env:
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/ingest_csv.py

      - name: Publish OE CDN shards to repo
        env:
          OE_CDN_PUBLISH_YEARS: current
        run: python scripts/publish_oe_cdn_to_git.py

      - name: Seed Supabase oe_slices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/seed_supabase.py

      - name: Verify Supabase seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_supabase_seed.py

      - name: Backfill gol.gg gold timelines (Cito fallback)
        continue-on-error: true
        id: gol_gold
        run: python scripts/backfill_gol_gold_timelines.py --year 2026 --max-fetch 50 --missing-only

      - name: Commit gol.gg gold cache
        if: steps.gol_gold.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/gol_game_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): backfill gol.gg gold timelines"
            git push || (git fetch origin main && git rebase origin/main && git push)
          else
            echo "gol gold cache unchanged — skip commit."
          fi

      - name: Install ML pipeline dependencies
        id: ml_deps
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: pip install -r scripts/requirements-ml.txt

      - name: Retrain nuckyAI ML pipeline
        if: steps.ml_deps.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        id: ml_retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python scripts/ml/build_feature_mart.py
          python scripts/ml/train_series_model.py
          python scripts/ml/train_draft_model.py
          python scripts/ml/build_trend_insights.py
          python scripts/ml/build_team_profiles.py
          python scripts/ml/build_champion_matchups.py
          python scripts/ml/build_player_ratings.py
          python scripts/ml/validate_champion_archetypes.py
          python scripts/ml/build_accuracy_scorecard.py
          python scripts/ml/export_artifacts.py

      - name: Publish model artifacts to nucky.gg
        id: ml_publish
        if: steps.ml_retrain.outcome == 'success'
        run: python scripts/ml/publish_model_to_site.py --outcome success

      - name: Record ML freshness after soft-fail (cron only)
        if: always() && steps.ml_deps.outcome == 'success' && steps.ml_retrain.outcome != 'success'
        continue-on-error: true
        env:
          RETRAIN_OUTCOME: ${{ steps.ml_retrain.outcome }}
        run: |
          outcome="${RETRAIN_OUTCOME:-failure}"
          python scripts/ml/write_ml_freshness.py --outcome "$outcome"
          echo "::warning::ML retrain did not succeed (outcome=$outcome). See public/data/ml_freshness.json"

      - name: Commit published model artifacts (static site + edge bundle)
        if: always() && (steps.ml_publish.outcome == 'success' || steps.ml_retrain.outcome != 'success') && steps.ml_deps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/agent-chat/ml/ || true
          git add \
            public/data/player_ratings.json \
            public/data/region_strength.json \
            public/data/accuracy_scorecard.json \
            public/data/prediction_holdout_log.json \
            public/data/model_metadata.json \
            public/data/ml_freshness.json || true
          if ! git diff --staged --quiet; then
            if [ "${{ steps.ml_retrain.outcome }}" = "success" ]; then
              git commit -m "chore(ml): publish model artifacts to nucky.gg"
            else
              git commit -m "chore(ml): record freshness after soft-fail retrain"
            fi
            git push || (git fetch origin main && git rebase origin/main && git push)
          else
            echo "Model publish artifacts unchanged — skip commit."
          fi

      - name: Deploy agent-chat edge function (live model packets)
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping live agent-chat deploy."
            exit 0
          fi
          REF=$(python -c "import os,re; u=os.environ.get('SUPABASE_URL',''); m=re.match(r'https://([a-z0-9-]+)\\.supabase\\.co', u or ''); print(m.group(1) if m else '')")
          if [ -z "$REF" ]; then
            echo "::warning::Could not parse project ref from SUPABASE_URL — skip edge deploy."
            exit 0
          fi
          npx supabase functions deploy agent-chat --project-ref "$REF" --use-api
          echo "Deployed agent-chat with fresh ml/ artifacts to project $REF."

      - name: Save OE Drive sync state
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_oe_drive_state.py
