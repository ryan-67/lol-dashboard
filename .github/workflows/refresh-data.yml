# Refresh Oracle's Elixir data: Drive → ingest → Supabase → schedule sync → recaps → gold → nuckyAI ML → publish model to nucky.gg.
#
# Autonomous flow (every 2h + manual dispatch):
# 1) check: compare current-year OE Drive CSV metadata to last sync (old years are stable)
# 2) if changed (or manual): download OE CSV → backfill history → ingest shards → publish CDN → seed oe_slices
# 3) sync Cito schedules + completed results (best-of / series scores; enrich bad team labels from match games)
# 4) generate weekly recap summaries only for concluded series (skip mid-Bo5)
# 5) sync Cito/gol gold timelines for series pages
# 6) retrain nuckyAI ML artifacts
# 7) publish model outputs to nucky.gg surfaces:
#      - public/data/{player_ratings,region_strength,accuracy_scorecard,model_metadata,ml_freshness}.json
#        (landing scorecard, dashboard power boards, prediction rankings — via git → GitHub Pages)
#      - supabase/functions/agent-chat/ml/* (committed; live chat needs edge deploy — see step below)
#
# When OE CSV is unchanged on cron, sync-scores still runs Cito schedule + recaps so
# finished Bo5 scores surface without waiting for the next Drive CSV bump.
# Cito schedule sync and weekly recap generation are hard failures (no continue-on-error).
#
# Scheduled: every 2 hours, check OE Drive metadata first. Full download/ingest/seed
# runs only when the current-year CSV changed (modifiedTime, size, or md5Checksum).
#
# Manual workflow_dispatch always runs the full refresh. On manual runs, ML soft-fail
# is disabled so a broken retrain fails the job loudly instead of silently leaving
# rankings frozen while OE advances.
#
# This is also nuckyAI's ONLY data source — the ML pipeline (scripts/ml/) reads the same
# lol/*.csv this job downloads and re-trains/re-exports its artifacts every time this job
# runs, so the model never depends on a manually-refreshed local CSV copy. Since the
# scheduled download only fetches the *current* year's CSV (to stay fast), a cached lol/
# history (restored below) + scripts/ensure_oe_history.py back it with the multi-year
# history the ML pipeline needs for rolling/team-form features and walk-forward validation.
# See docs/nuckyAI_model.md §8.9 and scripts/ml/README.md.
#
# Requires oe_sync_state table — see supabase/migrations/oe_sync_state.sql
# If check logs "permission denied for table oe_sync_state", re-run that migration's GRANT block
# in the Supabase SQL editor (service_role needs SELECT/INSERT/UPDATE/DELETE).
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GOOGLE_SERVICE_ACCOUNT_KEY
# Optional: OE_DRIVE_FOLDER_ID, OPENROUTER_API_KEY (weekly recap generation), CITO_API_KEY (schedule + gold)
# Optional: SUPABASE_ACCESS_TOKEN — when set, successful retrains auto-deploy agent-chat so
#           live prediction packets match the committed ml/ artifacts (without it, static
#           site rankings still update via git; chat stays on last manual edge deploy).

name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      download_scope:
        description: CSV years to download from Drive
        required: true
        default: current
        type: choice
        options:
          - current
          - all
      regenerate_recaps:
        description: Regenerate all weekly recap summaries (overwrite cached rows)
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Determine if refresh needed
        id: result
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — forcing full refresh."
          else
            changed=$(python scripts/check_oe_drive.py --format github)
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            if [ "$changed" = "true" ]; then
              echo "OE CSV changed on Drive — refresh will run."
            else
              echo "No OE CSV changes — skipping refresh."
            fi
          fi

  refresh:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Restore cached OE CSV history (for ML retrain)
        uses: actions/cache@v4
        with:
          path: lol
          key: oe-csv-history-v1-${{ github.run_id }}
          restore-keys: |
            oe-csv-history-v1-

      - name: Download Oracle's Elixir CSVs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/download_oe_csv.py

      - name: Backfill full OE history for ML training (cache miss only)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python scripts/ensure_oe_history.py --min-years 4

      - name: Ingest CSVs into slice JSON shards
        env:
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/ingest_csv.py

      - name: Publish OE CDN shards to repo
        env:
          OE_CDN_PUBLISH_YEARS: current
        run: python scripts/publish_oe_cdn_to_git.py

      - name: Seed Supabase oe_slices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OE_DOWNLOAD_YEARS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_scope || 'current' }}
        run: python scripts/seed_supabase.py

      - name: Verify Supabase seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_supabase_seed.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Cito league schedules (series scores + bracket blocks)
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-schedule

      - name: Sync external schedules (Leaguepedia EWC, etc.)
        continue-on-error: true
        run: npm run sync:external-schedule

      - name: Generate weekly recap summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          RECAP_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_recaps && '1' || '0' }}
        run: npm run generate:weekly-recap

      - name: Sync Cito postgame gold timelines
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-postgame -- --max-matches 20

      - name: Backfill gol.gg gold timelines (Cito fallback)
        continue-on-error: true
        id: gol_gold
        run: python scripts/backfill_gol_gold_timelines.py --year 2026 --max-fetch 50 --missing-only

      - name: Commit gol.gg gold cache
        if: steps.gol_gold.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/gol_game_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): backfill gol.gg gold timelines"
            git push || (git fetch origin main && git rebase origin/main && git push)
          else
            echo "gol gold cache unchanged — skip commit."
          fi

      - name: Install ML pipeline dependencies
        id: ml_deps
        # Soft-fail on cron so OE still publishes; hard-fail on manual dispatch.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: pip install -r scripts/requirements-ml.txt

      - name: Retrain nuckyAI ML pipeline
        if: steps.ml_deps.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        id: ml_retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python scripts/ml/build_feature_mart.py
          python scripts/ml/train_series_model.py
          python scripts/ml/train_draft_model.py
          python scripts/ml/build_trend_insights.py
          python scripts/ml/build_team_profiles.py
          python scripts/ml/build_champion_matchups.py
          python scripts/ml/build_player_ratings.py
          python scripts/ml/validate_champion_archetypes.py
          python scripts/ml/build_accuracy_scorecard.py
          python scripts/ml/export_artifacts.py

      - name: Publish model artifacts to nucky.gg
        id: ml_publish
        if: steps.ml_retrain.outcome == 'success'
        run: python scripts/ml/publish_model_to_site.py --outcome success

      - name: Record ML freshness after soft-fail (cron only)
        if: always() && steps.ml_deps.outcome == 'success' && steps.ml_retrain.outcome != 'success'
        continue-on-error: true
        env:
          RETRAIN_OUTCOME: ${{ steps.ml_retrain.outcome }}
        run: |
          outcome="${RETRAIN_OUTCOME:-failure}"
          python scripts/ml/write_ml_freshness.py --outcome "$outcome"
          echo "::warning::ML retrain did not succeed (outcome=$outcome). OE shards may be ahead of model rankings — see public/data/ml_freshness.json"

      - name: Commit published model artifacts (static site + edge bundle)
        if: always() && (steps.ml_publish.outcome == 'success' || steps.ml_retrain.outcome != 'success') && steps.ml_deps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Landing + dashboard rankings read public/data/* after GitHub Pages rebuilds.
          # Chat/prediction packets need the edge deploy step below for live Supabase.
          git add supabase/functions/agent-chat/ml/ || true
          git add \
            public/data/player_ratings.json \
            public/data/region_strength.json \
            public/data/accuracy_scorecard.json \
            public/data/prediction_holdout_log.json \
            public/data/model_metadata.json \
            public/data/ml_freshness.json || true
          if ! git diff --staged --quiet; then
            if [ "${{ steps.ml_retrain.outcome }}" = "success" ]; then
              git commit -m "chore(ml): publish model artifacts to nucky.gg"
            else
              git commit -m "chore(ml): record freshness after soft-fail retrain"
            fi
            git push || (git fetch origin main && git rebase origin/main && git push)
          else
            echo "Model publish artifacts unchanged — skip commit."
          fi

      - name: Deploy agent-chat edge function (live model packets)
        if: steps.ml_retrain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping live agent-chat deploy."
            echo "Static rankings still update via the git commit above."
            echo "To ship chat/prediction packets: npx supabase functions deploy agent-chat --use-api"
            exit 0
          fi
          REF=$(python -c "import os,re; u=os.environ.get('SUPABASE_URL',''); m=re.match(r'https://([a-z0-9-]+)\\.supabase\\.co', u or ''); print(m.group(1) if m else '')")
          if [ -z "$REF" ]; then
            echo "::warning::Could not parse project ref from SUPABASE_URL — skip edge deploy."
            exit 0
          fi
          npx supabase functions deploy agent-chat --project-ref "$REF" --use-api
          echo "Deployed agent-chat with fresh ml/ artifacts to project $REF."

      - name: Save OE Drive sync state
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_oe_drive_state.py

  # When OE CSV is unchanged, still refresh Cito series scores + recaps so finished
  # Bo5s (and mid-series progress) surface without waiting for the next Drive CSV bump.
  sync-scores:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Cito league schedules (series scores + bracket blocks)
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:cito-schedule

      - name: Sync external schedules (Leaguepedia EWC, etc.)
        continue-on-error: true
        run: npm run sync:external-schedule

      - name: Generate weekly recap summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          RECAP_REGENERATE: '0'
        run: npm run generate:weekly-recap
